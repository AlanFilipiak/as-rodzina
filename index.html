<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AS Rodzina</title>
<meta name="theme-color" content="#1e4d78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rodzina">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f2f5f9;--card:#fff;--tx:#14202e;--mut:#64748b;--ln:#e2e8f0;--pri:#1e4d78;--pri2:#2b7a9e;--acc:#ef6c5a;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#e8eef5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#18222e;--tx:#e6edf5;--mut:#94a3b8;--ln:#273445;--pri:#5fa8d8;--pri2:#4cb3c9;--chip:#223042}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;min-height:56px}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}body{background:#fff}}
@media (prefers-color-scheme:dark){header{background:#16324c}}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{background:none;border:0;color:#fff;font-size:24px;padding:0 6px 0 0;display:none}
#dot{width:12px;height:12px;border-radius:50%;background:#9ca3af;border:2px solid #fff6;flex:none}
#main{padding:12px 12px calc(96px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 10px;font-size:12px}
nav button b{display:block;font-size:22px;font-weight:normal}
nav button.on{color:var(--pri);font-weight:600}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 12px;box-shadow:0 1px 2px #0001}
h2{font-size:17px;margin:4px 0 10px}
h3{font-size:15px;margin:14px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px}
.mut{color:var(--mut);font-size:13px}
.b{border:0;border-radius:10px;padding:10px 12px;background:var(--chip);color:var(--tx);font:inherit;font-weight:600}
.b.pri{background:var(--pri);color:#fff}.b.danger{background:#fde2e2;color:#b91c1c}.b.sm{padding:6px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--ln)}
.list .it:last-child{border-bottom:0}
.it .grow{flex:1;min-width:0}
.ck{width:28px;height:28px;border-radius:8px;border:2px solid var(--pri);background:none;flex:none;color:#fff;font-size:17px;line-height:1;padding:0}
.ck.on{background:var(--ok);border-color:var(--ok)}
.done .nm{text-decoration:line-through;color:var(--mut)}
.tag{font-size:12px;background:var(--chip);border-radius:6px;padding:2px 7px;color:var(--mut);white-space:nowrap}
.tag.red{background:#fde2e2;color:#b91c1c}.tag.grn{background:#dcfce7;color:#166534}.tag.yel{background:#fef3c7;color:#92400e}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;flex:none}
.kid{cursor:pointer}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
label.row{color:var(--tx);font-size:15px}
.lab{font-size:13px;color:var(--mut);margin:8px 0 2px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-top:3px}
input[type=checkbox]{width:22px;height:22px;margin:0}
textarea{resize:vertical}
#ov{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:flex-end;justify-content:center}
#ov.on{display:flex}
#sheet{background:var(--card);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#111827ee;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;display:none;max-width:90%;text-align:center}
.addbar{display:flex;gap:6px}
.addbar input,.addbar select{margin:0}
.addbar #aName{flex:1}
.addbar #aQty{width:70px}
.addbar #aShop{width:110px}
.addbar .b{flex:none;font-size:20px;padding:6px 14px}
.grp{font-weight:700;color:var(--pri);margin:12px 0 2px;font-size:14px}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center;border:3px solid transparent;position:relative;box-shadow:0 1px 3px #0002}
.tile .e{font-size:44px;line-height:1.1}.tile .n{font-weight:700;font-size:16px;margin-top:6px}.tile .q{font-size:22px;font-weight:800;color:var(--pri)}
.tile.on{border-color:var(--ok);opacity:.55}.tile.on:after{content:"✓";position:absolute;top:4px;right:10px;font-size:30px;color:var(--ok);font-weight:900}
.big{font-size:22px;font-weight:800}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
details summary{cursor:pointer;font-weight:600;padding:8px 0}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv b{color:var(--mut);font-weight:500}
</style>
</head>
<body>
<header><button id="back" onclick="App.back()">‹</button><h1 id="title">AS Rodzina</h1><div id="dot" title="Synchronizacja"></div></header>
<div id="main"></div>
<nav id="nav">
<button data-t="kids"><b>👪</b>Rodzina</button>
<button data-t="meds"><b>💊</b>Leki</button>
<button data-t="shop"><b>🛒</b>Zakupy</button>
<button data-t="pack"><b>🎒</b>Pakowanie</button>
<button data-t="more"><b>⚙️</b>Więcej</button>
</nav>
<div id="ov"><div id="sheet"></div></div>
<div id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="body.js"></script>
<script src="health.js"></script>
<script src="vitals.js"></script>
<script src="updates.js"></script>
</body>
</html>
